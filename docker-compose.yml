services:

  mysql:
    image: mysql:8.0
    container_name: credit_card_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: credit_card_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  django:
    build:
      context: ./django_backend
    container_name: credit_card_django
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: credit_card_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    command: python manage.py runserver 0.0.0.0:8000

  fastapi:
    build:
      context: .
      dockerfile: fastapi_backend/Dockerfile
    container_name: credit_card_fastapi
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: credit_card_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8001:8001"
    depends_on:
      - mysql
volumes:
  mysql_data: